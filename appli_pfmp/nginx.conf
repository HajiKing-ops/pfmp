server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/octet-stream
        image/svg+xml
        font/ttf
        font/otf
        application/font-woff
        application/font-woff2;

    location ~* ^/(index\.html|main\.dart\.js|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|manifest\.json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* ^/(assets|canvaskit|icons)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Flutter Web is a single-page app.
    # If the user refreshes a Flutter route, return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy API requests through Nginx.
    # This allows Flutter to call /api/... instead of http://localhost:5002/api/...
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
