services:
  mysql:
    image: mysql:8.0
    container_name: pfmp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./PFMPManager.Api
      dockerfile: Dockerfile
    container_name: pfmp_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "server=mysql;port=3306;database=${MYSQL_DATABASE};user=root;password=${MYSQL_ROOT_PASSWORD};"
      Jwt__Key: ${JWT_SECRET}
      Jwt__Issuer: PFMPManager
      Jwt__Audience: PFMPManagerUsers
      Jwt__ExpireMinutes: 15
    ports:
      - "${API_PORT}:8080"

  flutter_web:
    build:
      context: ./appli_pfmp
      dockerfile: Dockerfile
    container_name: pfmp_flutter
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FLUTTER_PORT}:80"

volumes:
  mysql_data:
    external: true
    name: docker-test_mysql_data